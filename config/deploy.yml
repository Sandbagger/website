# Kamal v2 deploy config — williamneal.dev on the shared Hetzner host.
# Shared-host contract: docs/HETZNER_KAMAL_SHARED_HOST.md (dotfiles repo).
# Values in .env.deploy are loaded by bin/deploy before invoking kamal.

service: website
image: sandbagger/website

servers:
  web:
    hosts:
      - <%= ENV['KAMAL_HOST'] %>
  litestream:
    hosts:
      - <%= ENV['KAMAL_HOST'] %>
    cmd: ./bin/rails litestream:replicate

proxy:
  ssl: true
  host: williamneal.dev
  app_port: 3000

registry:
  server: ghcr.io
  username: Sandbagger
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

# Shared-host contract: durable state lives at /srv/apps/website/shared on the host.
# Mounted at /rails/storage so both Rails (SQLite + Active Storage) and
# Litestream see the same file.
volumes:
  - "<%= ENV.fetch('APP_SHARED_ROOT') %>:/rails/storage"

env:
  clear:
    RAILS_ENV: production
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
    LITESTREAM_DATABASE_PATH: /rails/storage/db/production.sqlite3
  secret:
    - RAILS_MASTER_KEY
    - LITESTREAM_REPLICA_URL
    - LITESTREAM_ACCESS_KEY_ID
    - LITESTREAM_SECRET_ACCESS_KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  dbconsole: app exec --interactive --reuse "bin/rails dbconsole"
  logs-web: app logs -r web -f
  logs-litestream: app logs -r litestream -f
